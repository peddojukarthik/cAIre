<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Record — cAIre</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#172033}.container{max-width:900px;margin:45px auto;padding:20px}.card{background:white;padding:30px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{padding:16px;background:#f8fafc;border-radius:10px}.label{font-size:13px;color:#64748b;margin-bottom:5px}.full{grid-column:1/-1}a{color:#2563eb;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div class="container"><p><a href="dashboard.html">← Dashboard</a></p><div class="card"><h1>Patient Record</h1><p>Source: Patient-provided information</p><div class="grid" id="record"></div></div></div>
<script>const p=JSON.parse(localStorage.getItem("caire_patient")||"{}");const fields=[["Patient Name","name"],["Age","age"],["Sex","sex"],["Blood Group","blood_group"],["Symptoms","symptoms"],["Existing Conditions","conditions"],["Allergies","allergies"],["Medications","medications"],["Additional Information","additional"]];document.getElementById("record").innerHTML=fields.map(([l,k])=>`<div class="item ${["symptoms","conditions","allergies","medications","additional"].includes(k)?"full":""}"><div class="label">${l}</div><div>${p[k]||"Not provided"}</div></div>`).join("");</script>
</body></html>
