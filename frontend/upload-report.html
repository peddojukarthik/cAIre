<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Upload Report — cAIre</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#172033}.container{max-width:700px;margin:70px auto;padding:20px}.card{background:white;padding:40px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.06)}.drop{border:2px dashed #93c5fd;border-radius:14px;padding:55px;text-align:center;background:#eff6ff}.drop input{margin-top:20px}.button{width:100%;padding:14px;margin-top:25px;background:#2563eb;color:white;border:0;border-radius:8px;font-size:16px}a{display:block;margin-top:20px;text-align:center;color:#2563eb;text-decoration:none}.warning{margin-top:25px;padding:15px;background:#f8fafc;color:#64748b;border-radius:8px}</style></head>
<body><div class="container"><div class="card"><h1>Upload Medical Report</h1><p>Select a PDF or medical report for processing.</p><div class="drop"><div style="font-size:40px">📄</div><b>Choose a medical report</b><br><input type="file" id="report" accept=".pdf,.png,.jpg,.jpeg"></div><button class="button" onclick="processReport()">Process Report</button><div class="warning">Reference ranges will only be used when they are present in the source report. cAIre does not invent reference ranges or provide diagnoses.</div><a href="dashboard.html">← Back to Dashboard</a></div></div>
<script>function processReport(){const f=document.getElementById("report").files[0];if(!f){alert("Please select a report first.");return}localStorage.setItem("caire_report_name",f.name);location.href="report-result.html"}</script>
</body></html>
